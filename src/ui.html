<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* Figma adds .figma-light or .figma-dark to <html> (showUI themeColors: true).
       Every pair below is measured; recheck with `npm run check:contrast` after changing one. */
    :root {
      --bg: #ffffff;
      --bg-card: #fafafa;
      --border: #e4e4e7;
      --border-hover: #d4d4d8;
      --text: #09090b;
      --text-muted: #71717a;
      --accent: #7c3aed;
      --accent-fg: #7c3aed;
      --badge-balance-bg: #ede9fe;
      --badge-balance-fg: #7c3aed;
      --badge-pretty-bg: #fce7f3;
      --badge-pretty-fg: #be185d;
      --toast-success-bg: #ecfdf5;
      --toast-success-fg: #065f46;
      --toast-success-border: #a7f3d0;
      --toast-error-bg: #fef2f2;
      --toast-error-fg: #991b1b;
      --toast-error-border: #fecaca;

      --text-lg: 14px;
      --text-md: 13px;
      --text-sm: 12px;
      --text-xs: 11px;

      --radius: 10px;
      color-scheme: light;
    }

    html.figma-dark {
      --bg: #18181b;
      --bg-card: #27272a;
      --border: #3f3f46;
      --border-hover: #52525b;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent-fg: #a78bfa;
      --badge-balance-bg: #2e1065;
      --badge-balance-fg: #c4b5fd;
      --badge-pretty-bg: #500724;
      --badge-pretty-fg: #f9a8d4;
      --toast-success-bg: #064e3b;
      --toast-success-fg: #a7f3d0;
      --toast-success-border: #065f46;
      --toast-error-bg: #450a0a;
      --toast-error-fg: #fecaca;
      --toast-error-border: #991b1b;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: var(--text-md);
      background: var(--bg);
      color: var(--text);
      width: 280px;
      overflow-x: hidden;
    }

    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg {
      width: 16px;
      height: 16px;
      color: white;
    }

    .header-text h1 {
      font-size: var(--text-lg);
      font-weight: 600;
      line-height: 1.2;
      text-wrap: balance;
    }

    .header-text p {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.3;
      text-wrap: pretty;
    }

    /* Groups */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reset-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Action cards */
    .card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: inherit;
      font: inherit;
      text-align: start;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--accent-fg);
    }

    .card-icon svg {
      width: 20px;
      height: 20px;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-name {
      font-size: var(--text-md);
      font-weight: 600;
    }

    .badge {
      font-size: var(--text-xs);
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 99px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .badge-balance {
      background: var(--badge-balance-bg);
      color: var(--badge-balance-fg);
    }

    .badge-pretty {
      background: var(--badge-pretty-bg);
      color: var(--badge-pretty-fg);
    }

    .card-desc {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.4;
      text-wrap: pretty;
    }

    /* Reset button */
    .reset-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-btn svg {
      width: 14px;
      height: 14px;
    }

    .caption {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
      text-wrap: pretty;
    }

    /* Shared control states */
    .card:focus-visible,
    .reset-btn:focus-visible {
      outline: 2px solid var(--accent-fg);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .card:not([aria-disabled="true"]):hover {
        border-color: var(--border-hover);
      }

      .reset-btn:not([aria-disabled="true"]):hover {
        background: var(--bg-card);
        border-color: var(--border-hover);
        color: var(--text);
      }
    }

    [aria-disabled="true"] {
      opacity: 0.5;
      cursor: default;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: var(--text-sm);
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
      text-wrap: pretty;
      opacity: 0;
      translate: 0 8px;
      pointer-events: none;
      z-index: 10;
    }

    .toast-visible {
      opacity: 1;
      translate: 0 0;
    }

    .toast-success {
      background: var(--toast-success-bg);
      color: var(--toast-success-fg);
      border-color: var(--toast-success-border);
    }

    .toast-info {
      background: var(--bg-card);
      color: var(--text);
      border-color: var(--border);
    }

    .toast-error {
      background: var(--toast-error-bg);
      color: var(--toast-error-fg);
      border-color: var(--toast-error-border);
    }

    /* Motion is opt-in */
    @media (prefers-reduced-motion: no-preference) {
      .card,
      .reset-btn {
        transition-property: background-color, border-color, color, scale;
        transition-duration: 150ms;
        transition-timing-function: ease-out;
      }

      .card:not([aria-disabled="true"]):active,
      .reset-btn:not([aria-disabled="true"]):active {
        scale: 0.96;
      }

      .toast {
        transition-property: opacity, translate;
        transition-duration: 200ms;
        transition-timing-function: ease-out;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="header-icon">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="15" y2="12"/>
          <line x1="3" y1="18" x2="18" y2="18"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Smart Text Wrap</h1>
        <p>Select any layer to fix text wrapping</p>
      </div>
    </header>

    <div class="actions">
      <button type="button" id="balanceCard" class="card">
        <span class="card-icon">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">
            <span class="card-name">Balance</span>
            <span class="badge badge-balance">Headlines</span>
          </span>
          <span class="card-desc">Equalizes line lengths for visual symmetry</span>
        </span>
      </button>

      <button type="button" id="prettyCard" class="card">
        <span class="card-icon">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="15" y2="18"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">
            <span class="card-name">Pretty</span>
            <span class="badge badge-pretty">Body text</span>
          </span>
          <span class="card-desc">Prevents orphaned words on the last line</span>
        </span>
      </button>
    </div>

    <div class="reset-group">
      <button type="button" id="resetBtn" class="reset-btn" aria-describedby="resetHint">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 1 3 6.36"/>
          <polyline points="3 16 3 12 7 12"/>
        </svg>
        Reset text
      </button>
      <p id="resetHint" class="caption">Removes plugin line breaks and restores original text</p>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <!-- __UI_SCRIPT__ -->
</body>
</html>
