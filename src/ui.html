<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    :root {
      --bg: #ffffff;
      --bg-card: #fafafa;
      --bg-card-hover: #f4f4f5;
      --border: #e4e4e7;
      --border-hover: #d4d4d8;
      --text: #09090b;
      --text-muted: #71717a;
      --text-caption: #a1a1aa;
      --accent-balance: #7c3aed;
      --accent-balance-bg: #ede9fe;
      --accent-pretty: #7c3aed;
      --accent-pretty-bg: #fce7f3;
      --radius: 10px;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --bg-card: #27272a;
        --bg-card-hover: #303033;
        --border: #3f3f46;
        --border-hover: #52525b;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --text-caption: #71717a;
        --accent-balance-bg: #2e1065;
        --accent-pretty-bg: #500724;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      width: 280px;
      overflow-x: hidden;
    }

    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-balance);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg {
      width: 16px;
      height: 16px;
      color: white;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Action cards */
    .card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
    }

    .card:focus-visible {
      outline: 2px solid var(--accent-balance);
      outline-offset: 2px;
    }

    .card:active {
      transform: scale(0.99);
    }

    .card.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .card-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .card-icon svg {
      width: 20px;
      height: 20px;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }

    .card-title span {
      font-size: 13.5px;
      font-weight: 600;
    }

    .badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 99px;
      line-height: 1.4;
    }

    .badge-balance {
      background: var(--accent-balance-bg);
      color: var(--accent-balance);
    }

    .badge-pretty {
      background: var(--accent-pretty-bg);
      color: #db2777;
    }

    @media (prefers-color-scheme: dark) {
      .badge-balance { color: #c4b5fd; }
      .badge-pretty { color: #f9a8d4; }
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    /* Reset button */
    .reset-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-btn:hover {
      background: var(--bg-card);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .reset-btn:focus-visible {
      outline: 2px solid var(--accent-balance);
      outline-offset: 2px;
    }

    .reset-btn:active {
      transform: scale(0.99);
    }

    .reset-btn.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .reset-btn svg {
      width: 14px;
      height: 14px;
    }

    .caption {
      font-size: 11px;
      color: var(--text-caption);
      text-align: center;
      line-height: 1.4;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 10;
    }

    .toast-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .toast-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    @media (prefers-color-scheme: dark) {
      .toast-success {
        background: #064e3b;
        color: #a7f3d0;
        border-color: #065f46;
      }
      .toast-error {
        background: #450a0a;
        color: #fecaca;
        border-color: #991b1b;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card:active,
      .reset-btn:active {
        transform: none;
      }
      .toast {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="15" y2="12"/>
          <line x1="3" y1="18" x2="18" y2="18"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Smart Text Wrap</h1>
        <p>Select any layer to fix text wrapping</p>
      </div>
    </div>

    <div id="balanceCard" class="card" role="button" tabindex="0" aria-label="Balance: equalizes line lengths for visual symmetry">
      <div class="card-icon">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </div>
      <div class="card-body">
        <div class="card-title">
          <span>Balance</span>
          <span class="badge badge-balance">Headlines</span>
        </div>
        <p class="card-desc">Equalizes line lengths for visual symmetry</p>
      </div>
    </div>

    <div id="prettyCard" class="card" role="button" tabindex="0" aria-label="Pretty: prevents orphaned words on the last line">
      <div class="card-icon">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="15" y2="18"/>
        </svg>
      </div>
      <div class="card-body">
        <div class="card-title">
          <span>Pretty</span>
          <span class="badge badge-pretty">Body text</span>
        </div>
        <p class="card-desc">Prevents orphaned words on the last line</p>
      </div>
    </div>

    <div class="divider"></div>

    <button id="resetBtn" class="reset-btn" aria-label="Reset text: removes plugin line breaks and restores original text">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 1 3 6.36"/>
        <polyline points="3 16 3 12 7 12"/>
      </svg>
      Reset text
    </button>

    <p class="caption">Removes plugin line breaks and restores original text</p>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- __UI_SCRIPT__ -->
</body>
</html>
