<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 12px;
      background: #2c2c2c;
      color: #e0e0e0;
      padding: 16px;
      width: 240px;
      height: 180px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      color: #999;
      margin-bottom: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 12px;
      color: #ccc;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #555;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: #7b61ff;
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(16px);
    }

    button {
      width: 100%;
      padding: 10px;
      background: #7b61ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #6a4ff0;
    }

    button:active {
      background: #5a3fe0;
    }

    .status {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 8px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h1>Smart Text Wrap</h1>
  <p class="subtitle">Auto-fix orphans &amp; balance text</p>

  <div class="toggle-row">
    <span class="toggle-label">Auto-fix on deselect</span>
    <label class="toggle">
      <input type="checkbox" id="autoToggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <button id="fixPageBtn">Fix This Page</button>
  <p class="status" id="status"></p>

  <script src="ui.js"></script>
</body>
</html>
